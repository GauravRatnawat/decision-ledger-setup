name: Deploy private ledger
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-ledger-production
  cancel-in-progress: true
jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get private journals
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 10.34.5
          run_install: false
      - name: Set Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.12.0
      - name: Test runner
        run: node --test tests/site.test.mjs
      - name: Get exact setup pin
        run: node scripts/site.mjs prepare
      - name: Install deps
        run: node scripts/site.mjs install
      - name: Test setup
        run: node scripts/site.mjs test
      - name: Check site
        run: node scripts/site.mjs check
      - name: Build site
        run: node scripts/site.mjs build
      - name: Deploy site and Functions
        working-directory: .site/setup
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm dlx wrangler@4.117.0 pages deploy dist
          --project-name "$(node -p 'JSON.parse(require("node:fs").readFileSync("../../journal-site.json", "utf8")).pagesProject')"
          --branch master
          --commit-hash "$GITHUB_SHA"
