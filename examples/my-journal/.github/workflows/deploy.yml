name: Deploy private ledger
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-ledger-production
  cancel-in-progress: true
jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get private journals
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 10.34.5
          run_install: false
      - name: Set Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.12.0
      - name: Build pinned setup
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { existsSync, mkdirSync, readFileSync } from 'node:fs';
          import path from 'node:path';

          const root = process.cwd();
          const setup = path.join(root, '.site/setup');
          const config = JSON.parse(readFileSync('journal-site.json', 'utf8'));
          const check = (ok, message) => { if (!ok) throw new Error(message); };
          const hasText = value => typeof value === 'string' && value.trim().length > 0;
          check(config && typeof config === 'object' && !Array.isArray(config), 'Site config needs object.');
          check(typeof config.revision === 'string' && /^[a-f0-9]{40}$/.test(config.revision), 'Site revision needs 40 lowercase hex chars.');
          check(hasText(config.repository) && (path.isAbsolute(config.repository) || /^https:\/\/github\.com\/[\w.-]+\/[\w.-]+(?:\.git)?$/.test(config.repository)), 'Site repository needs full local path or HTTPS GitHub URL.');
          check(hasText(config.siteUrl), 'Site URL missing.');
          const url = new URL(config.siteUrl);
          check(!url.username && !url.password && (url.protocol === 'https:' || (url.protocol === 'http:' && ['localhost', '127.0.0.1', '[::1]'].includes(url.hostname))), 'Site needs HTTPS URL or HTTP localhost.');
          check(typeof config.journalRepository === 'string' && /^[\w-]+\/[\w.-]+$/.test(config.journalRepository), 'Journal repo needs owner/repo.');
          check(hasText(config.journalBranch) && !config.journalBranch.startsWith('-'), 'Journal branch missing or bad.');
          check(hasText(config.pagesProject), 'Pages project missing.');
          // Fresh checkout only. Keep old output intact on local rerun.
          check(!existsSync(path.join(root, '.site')), 'Site folder exists. Use fresh journal checkout.');
          mkdirSync(setup, { recursive: true });
          const gitEnv = Object.fromEntries(Object.entries(process.env).filter(([key]) => !key.startsWith('GIT_')));
          const git = (...args) => execFileSync('git', args, {
            cwd: setup, env: gitEnv, encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'],
          }).trim();
          const verify = () => {
            check(git('rev-parse', 'HEAD') === config.revision, 'Setup needs exact pin.');
            check(git('rev-parse', '--abbrev-ref', 'HEAD') === 'HEAD', 'Setup needs detached checkout.');
            check(!git('status', '--porcelain', '--untracked-files=all') && git('ls-files', '-v').split('\n').every(line => !line || line.startsWith('H ')), 'Setup needs clean pin.');
          };
          try {
            git('init');
            git('fetch', '--no-tags', config.repository, config.revision);
            git('checkout', '--detach', config.revision);
          } catch {
            throw new Error('Setup fetch failed. Check repository and full commit SHA.');
          }
          for (const args of [['install', '--frozen-lockfile'], ['run', 'test'], ['run', 'check'], ['run', 'build']]) {
            verify();
            execFileSync('pnpm', args, {
              cwd: setup, stdio: 'inherit',
              env: {
                ...process.env,
                JOURNAL_ROOT: root,
                JOURNAL_SITE_URL: config.siteUrl,
                JOURNAL_REPOSITORY: config.journalRepository,
                JOURNAL_BRANCH: config.journalBranch,
              },
            });
          }
          verify();
          NODE
      - name: Deploy site and Functions
        working-directory: .site/setup
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm dlx wrangler@4.117.0 pages deploy dist
          --project-name "$(node -p 'JSON.parse(require("node:fs").readFileSync("../../journal-site.json", "utf8")).pagesProject')"
          --branch master
          --commit-hash "$GITHUB_SHA"
